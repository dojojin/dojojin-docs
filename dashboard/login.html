<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>DojoJin Tech Dashboard — Login</title>
<link rel="icon" type="image/png" href="/favicon.ico" id="brandFavicon">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<script src="/i18n.js"></script>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #131826;
    --panel2: #1a2030;
    --border: #232b3d;
    --accent: #5b8def;
    --text: #e4e8f0;
    --dim: #7f8694;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --ui-font-family: 'Noto Sans Thai', 'Noto Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  input, button, select, textarea { font-family: inherit; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--ui-font-family);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(91, 141, 239, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.06) 0%, transparent 40%);
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  .logo {
    text-align: center;
    margin-bottom: 30px;
  }
  .logo-icon {
    font-size: 42px;
    margin-bottom: 8px;
  }
  .logo-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .logo-subtitle {
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 1px;
  }
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 11px;
    color: var(--dim);
    margin-bottom: 6px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .form-input {
    width: 100%;
    padding: 12px 14px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: 14px;
    transition: all .15s;
  }
  .form-input:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(91,141,239,0.05);
  }
  .btn-login {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
    margin-top: 8px;
  }
  .btn-login:hover { opacity: 0.9; }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-msg {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 16px;
    display: none;
  }
  .error-msg.show { display: block; }
  .footer-info {
    text-align: center;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--dim);
    line-height: 1.6;
  }
  .footer-info code {
    background: var(--panel2);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
  }
  .lang-toggle { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .lang-toggle button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
    padding: 4px 12px; border-radius: 5px; font-size: 11px; cursor: pointer;
  }
  html[lang="th"] #langTh, html[lang="en"] #langEn {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-icon" id="brandLogoIcon">🛡️</div>
    <div class="logo-title" id="brandTitle">DojoJin Tech Dashboard</div>
    <div class="logo-subtitle">SECURE LOGIN</div>
  </div>

  <div id="errorMsg" class="error-msg"></div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="form-group">
      <label class="form-label" data-i18n="login.username">ชื่อผู้ใช้</label>
      <input type="text" class="form-input" id="username" required autofocus autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="login.password">รหัสผ่าน</label>
      <input type="password" class="form-input" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login" id="btnLogin" data-i18n="login.signIn">เข้าสู่ระบบ</button>
  </form>

  <div class="footer-info">
    <div data-i18n="login.ipLockHint">🔐 ระบบจะล็อก IP หลังพยายามเข้าสู่ระบบผิด 5 ครั้งภายใน 15 นาที</div>
    <div data-i18n="login.credHint" style="margin-top:4px">กรุณากรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าสู่ระบบ</div>
    <div class="lang-toggle">
      <button type="button" id="langTh" onclick="I18N.setLang('th')">ไทย</button>
      <button type="button" id="langEn" onclick="I18N.setLang('en')">EN</button>
    </div>
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:10px">
      © 2025-2026 <a href="https://dojojin.tech/" target="_blank" style="color:var(--dim);text-decoration:none">DojoJin Tech</a> by Prakasit Rochanavipart<br>
      <span style="opacity:0.6">All Rights Reserved · Proprietary Software</span>
    </div>
  </div>
</div>

<script>
// ตรวจว่ายอมรับ disclaimer แล้วหรือยัง — ถ้ายัง → redirect กลับไป
if (sessionStorage.getItem('disclaimer_accepted') !== '1') {
  window.location.href = '/disclaimer.html';
}

// Apply customer's branding (public endpoint, no auth)
(async () => {
  try {
    const r = await fetch('/api/branding', { cache: 'no-store' });
    if (!r.ok) return;
    const b = await r.json();
    if (b.name) {
      document.title = `${b.name} — Login`;
      const t = document.getElementById('brandTitle');
      if (t) t.textContent = b.name;
    }
    if (b.logo_url) {
      const icon = document.getElementById('brandLogoIcon');
      if (icon) icon.innerHTML = `<img src="${b.logo_url}?v=${Date.now()}" alt="logo" style="width:64px;height:64px;object-fit:contain">`;
      const fav = document.getElementById('brandFavicon');
      if (fav) fav.href = '/favicon.ico?v=' + Date.now();
    }
    if (b.primary_color) document.documentElement.style.setProperty('--accent', b.primary_color);
  } catch {}
})();

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const errEl = document.getElementById('errorMsg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = I18N.t('login.signingIn');
  errEl.classList.remove('show');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      errEl.textContent = data.error || I18N.t('login.failed');
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = I18N.t('login.signIn');
      return;
    }

    // 🆕 เก็บ token ใน localStorage + sessionStorage (กัน Safari ITP ลบ localStorage)
    if (data.token) {
      try { localStorage.setItem('bosch_session_token', data.token); } catch {}
      try { sessionStorage.setItem('bosch_session_token', data.token); } catch {}
    }

    // 🆕 Pass token ทาง URL hash (ไม่ส่งไป server, browser ไม่แชร์ออก) — กัน Safari ITP
    // Dashboard JS จะอ่าน hash → set localStorage แล้ว clean URL
    setTimeout(() => {
      window.location.href = '/#t=' + encodeURIComponent(data.token);
    }, 100);
  } catch (err) {
    errEl.textContent = I18N.t('login.connErr') + err.message;
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = I18N.t('login.signIn');
  }
}

// ถ้า login อยู่แล้ว → redirect ไป dashboard
(async () => {
  try {
    const token = localStorage.getItem('bosch_session_token');
    const headers = {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api/auth/me', {
      credentials: 'include',
      headers,
    });
    if (res.ok) window.location.href = '/';
  } catch {}
})();
</script>

</body>
</html>
