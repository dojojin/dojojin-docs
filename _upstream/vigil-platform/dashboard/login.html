<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Vigil Platform — Login</title>
<link rel="icon" type="image/png" href="/favicon.ico" id="brandFavicon">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<script src="/i18n.js"></script>
<link rel="stylesheet" href="/login.css">
</head>
<body>

<button type="button" id="themeToggleBtn">
  <svg id="themeIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
  <span id="themeLabel"></span>
</button>

<div class="login-card">
  <div class="logo">
    <div class="logo-icon" id="brandLogoIcon">🛡️</div>
    <div class="logo-title" id="brandTitle">Vigil Platform</div>
    <div class="logo-subtitle">SECURE LOGIN</div>
  </div>

  <div id="errorMsg" class="error-msg"></div>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label" data-i18n="login.username">ชื่อผู้ใช้</label>
      <input type="text" class="form-input" id="username" required autofocus autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="login.password">รหัสผ่าน</label>
      <input type="password" class="form-input" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login" id="btnLogin" data-i18n="login.signIn">เข้าสู่ระบบ</button>
  </form>

  <div class="footer-info">
    <div data-i18n="login.ipLockHint">🔐 ระบบจะล็อก IP หลังพยายามเข้าสู่ระบบผิด 5 ครั้งภายใน 15 นาที</div>
    <div data-i18n="login.credHint" style="margin-top:4px">กรุณากรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าสู่ระบบ</div>
    <div class="lang-toggle">
      <button type="button" id="langTh">ไทย</button>
      <button type="button" id="langEn">EN</button>
    </div>
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:10px">
      © 2025-2026 <a href="https://dojojin.tech/" target="_blank" style="color:var(--dim);text-decoration:none">DojoJin Tech</a> by Prakasit Rochanavipart<br>
      <span style="opacity:0.6">All Rights Reserved · Proprietary Software</span>
    </div>
  </div>
</div>

<script src="/login.js"></script>

</body>
</html>
