# ============================================================
# Vigil Platform — Mosquitto config template (Central)
# ------------------------------------------------------------
# Install as /etc/mosquitto/conf.d/vigil.conf (the PPA/apt package layout —
# the package's /etc/mosquitto/mosquitto.conf already `include_dir`s
# /etc/mosquitto/conf.d/). NOT deployed by anything yet — this file is a
# template for M2 cutover (docs/reports/2026-09-27_mosquitto-migration-plan.md
# M2). Target: PPA `ppa:mosquitto-dev/mosquitto-ppa` (2.1.x) installed
# directly on the Central host (systemd `mosquitto.service`), not docker —
# same version as all 5 edges (owner decision 2026-09-27 §6.1 item 5).
#
# Verified 2026-09-28 by extracting the actual package
# (mosquitto_2.1.2-0mosquitto1~noble1_amd64.deb) with `dpkg-deb -x`:
#   - the plugin path below IS correct for the 2.1.x PPA build too (same
#     path as the 2.0.18 apt build that GOTCHAS/plan §8 already measured) —
#     no longer an unverified TODO.
#   - the package's /etc/mosquitto/mosquitto.conf already sets `pid_file`,
#     `persistence true` + `persistence_location /var/lib/mosquitto/`, and
#     `log_dest file /var/log/mosquitto/mosquitto.log`, then
#     `include_dir /etc/mosquitto/conf.d`. This file deliberately does NOT
#     repeat those three — conf.d is meant to layer on top of the package
#     default, not re-declare it. `log_dest stdout` below is additive
#     (captured to the systemd journal alongside the file sink), not a
#     duplicate of it.
#
# No `per_listener_settings` — unlike the edge template (which needs one
# anonymous loopback listener + one authenticated LAN listener), Central has
# no anonymous listener at all, so a single global `allow_anonymous false`
# covers both listeners without per-listener scoping.
#
# Central only binds 127.0.0.1 — no camera connects to Central's 1883 directly
# (plan §0 fact: 8 connections total, all edge-bridge / internal services).
# Cloudflare Tunnel still points at 127.0.0.1:8083 (unchanged from EMQX).
# ============================================================

listener 1883 127.0.0.1
protocol mqtt

listener 8083 127.0.0.1
protocol websockets

# Tailscale — เส้นหลักของ edge-bridge (เจ้าของเลือก 2026-10-18 · src/edge/bridgePaths.js)
# MQTT ไม่เข้ารหัสในตัว แต่วิ่งใน WireGuard ของ tailnet · ACL ของ tailnet เปิดแค่ tag:edge → tag:central:1883
# ต้องคู่กับ /etc/sysctl.d/99-vigil-nonlocal-bind.conf: net.ipv4.ip_nonlocal_bind = 1
# ไม่งั้นถ้า Mosquitto บูตก่อน tailscaled (IP นี้ยังไม่มี) broker จะ start ไม่ขึ้นทั้งตัว และพาทุกเส้นทางล่มไปด้วย
# บนเครื่องจริงวางเป็นไฟล์แยก /etc/mosquitto/conf.d/zz-tailscale-listener.conf ที่มีสองบรรทัดนี้
# (เป็น comment ที่นี่โดยตั้งใจ — ถ้าไฟล์นี้กับไฟล์แยกประกาศซ้ำกัน พอร์ตชนแล้ว broker ไม่ขึ้น):
#   listener 1883 100.89.1.29
#   protocol mqtt

allow_anonymous false

# ── Dynamic security (auth + ACL, replaces EMQX built_in_database) ──
plugin /usr/lib/x86_64-linux-gnu/mosquitto_dynamic_security.so
plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json

# ── Queue limits (plan §5 risk: the edge-bridge replay queue on reconnect
# must not be truncated by Mosquitto's defaults — 1000 queued / 20 inflight
# is too small for a queue that can back up during a Cloudflare tunnel blip) ──
max_queued_messages 10000
max_inflight_messages 100
max_queued_bytes 0

# ── Logging (package default already writes the file sink above — this adds
# stdout so `journalctl -u mosquitto` shows it too) ──
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
