# ──────────────────────────────────────
# Mosquitto MQTT Broker Configuration
# สำหรับรับ metadata จากกล้อง Bosch
# ──────────────────────────────────────

# MQTT listener (กล้อง Bosch เชื่อมต่อที่นี่)
listener 1883
protocol mqtt

# WebSocket listener (สำหรับ Dashboard real-time)
listener 9001
protocol websockets

# อนุญาตให้เชื่อมต่อโดยไม่ต้อง login (dev mode)
# ⚠️ Production: เปลี่ยนเป็น false แล้วตั้ง password_file
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all
connection_messages true
